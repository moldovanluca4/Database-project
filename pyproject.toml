[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-information-center"
version = "0.1.0"
description = "Campus Information Center application and supporting coursework tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "mysql-connector-python>=9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
    "pytest>=8.3,<10",
]
sqlalchemy = [
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
]
legacy = [
    "mariadb>=1.1,<2",
]
analytics = [
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
]
all = [
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "mariadb>=1.1,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["archive"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Preserve existing application code while enabling lint checks.
# These exceptions apply only to rules already violated in these exact files.
# E701: one-line conditionals; F401: unused imports; F841: unused variables.
[tool.ruff.lint.per-file-ignores]
"apps/campus_information_center/app_v1.py" = ["E701", "F401"]
"apps/campus_information_center/app_v2.py" = ["E701", "F401", "F841"]
"apps/campus_information_center/the_app_using_sqlalchemy_notforserver.py" = ["F401"]
"tools/log_analysis/statistics.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
